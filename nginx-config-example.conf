# Nginx Configuration for Vikings Invoice
# Place this in: /etc/nginx/sites-available/vikings-invoice

# Backend API (api.deluwang.online)
server {
    listen 80;
    server_name api.deluwang.online;

    # Increase body size for large uploads (Base64)
    client_max_body_size 100M;
    client_body_timeout 300s;

    # Timeouts for large uploads
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://localhost:3202;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# User App (deluwang.online)
server {
    listen 80;
    server_name deluwang.online www.deluwang.online;

    location / {
        proxy_pass http://localhost:3200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# Admin App (admin.deluwang.online)
server {
    listen 80;
    server_name admin.deluwang.online;

    location / {
        proxy_pass http://localhost:3201;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# IMPORTANT NOTES:
# 1. Replace 'listen 80' with 'listen 443 ssl' if using HTTPS
# 2. Add SSL certificate configuration if using HTTPS
# 3. After editing, test config: sudo nginx -t
# 4. Reload nginx: sudo systemctl reload nginx
# 5. Make sure PM2 services are running on ports 3200, 3201, 3202
