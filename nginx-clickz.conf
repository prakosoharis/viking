# Nginx config untuk clickz.co.no (Cloudflare proxied -> origin port 80)
# Pasang di server: /etc/nginx/sites-available/clickz.conf
#   sudo ln -s /etc/nginx/sites-available/clickz.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Backend API
server {
    listen 80;
    server_name api.clickz.co.no;

    # Upload besar (base64 bisa sampai ~100MB)
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3202;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

# Admin App
server {
    listen 80;
    server_name admin.clickz.co.no;

    location / {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# User App (domain utama + www)
server {
    listen 80;
    server_name clickz.co.no www.clickz.co.no;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
