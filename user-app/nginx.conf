server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static pages (same as staticPagesPlugin in vite.config.js)
    location = /about   { try_files /about.html =404; }
    location = /privacy { try_files /privacy.html =404; }
    location = /terms   { try_files /terms.html =404; }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
