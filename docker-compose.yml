services:
  mongodb:
    image: mongo:7.0
    container_name: vikings-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: invoice_db
    volumes:
      - mongodb_data:/data/db
      - ./backend/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - vikings-network

  backend:
    build: ./backend
    container_name: vikings-backend
    restart: always
    ports:
      - "3202:3202"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/invoice_db?authSource=admin
      PORT: 3202
    depends_on:
      - mongodb
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - vikings-network

  user-app:
    build:
      context: ./user-app
      args:
        VITE_API_URL: http://localhost:3202/api
    container_name: vikings-user-app
    restart: always
    ports:
      - "3200:80"
    depends_on:
      - backend
    networks:
      - vikings-network

  admin-app:
    build:
      context: ./admin-app
      args:
        VITE_API_URL: http://localhost:3202/api
    container_name: vikings-admin-app
    restart: always
    ports:
      - "3201:80"
    depends_on:
      - backend
    networks:
      - vikings-network

volumes:
  mongodb_data:

networks:
  vikings-network:
    driver: bridge
